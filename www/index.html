    <style>
        body{
            height: 100%;
            overflow: hidden;
        }
        .map{
            height: 100%;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            position:absolute;
            top:0;
            left:0;
            z-index: 1;
        }
        
        .nav_main {
            position: absolute;
            bottom: 60px; /* 剛好藏在 navbar 上面 */
            left: 0;
            width: 100%;
            height: 50px;
            background: white;
            color:black;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.25);
            transform: translateY(calc(100% - 50px)); /* 一開始完全收回 */
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .nav_main.open {
            transform: translateY(0); /* 展開 */
            height: 40%;
        }

        .eew_list{
            height: 100%;
            overflow-y: scroll;
        }

        .server_status{
            display: flex;
            text-align: center;
            padding: 5px;
            height: fit-content;
            width: fit-content;
            position: absolute;
            top:5px;
            right: 5px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            background-color: white;
            color: black;
            z-index: 20;
        }

        /* drag handle */
        .drag_handle {
            width: 60px;
            height: 6px;
            background: #ccc;
            border-radius: 3px;
            margin: 10px auto;
            /*position: absolute;
            bottom: 50px;  
            left: 0;
            right: 0;*/
            z-index: 15;
            cursor: pointer;
        }

        .navbar{
            /*margin: 20px;*/
            width: 100%;
            display: flex;
            position: absolute;
            bottom: 0;
            left: 0;
            flex-wrap: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            background-color: white;
            color: black;
            z-index: 20;
        }

        .navitem{
            border-bottom: solid;
            cursor: pointer; 
            margin-bottom: 3px;
            /*border-bottom-color: white;*/
            margin-right: 15px;
            width:33.3%
        }
        
        .eew_tile{
            border: solid 0px;
            border-color: black;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            margin: 20px;
            padding: 20px;
            padding-top: 10px;
        }
        .eew_title{

        }
        .local_expect{
            display: flex;
        }
        .local_expect_shindo{
            display: flex;
            width: 50%;
            border-right: 1px solid;
        }
        .local_expect_time{
            display: flex;
            width: 50%;
        }
        .eew_content{
            display: flex;
            flex-wrap: nowrap;
        }
        .eew_maxShindo{
            width:20%;
            margin-top: 20px;
            margin-right: 20px;
        }
        .eew_details{
            width:80%;
        }

        .report_content{
            display: flex;
            flex-wrap: nowrap;
        }
        .report_maxShindo{
            width:20%;
            margin-top: 20px;
            margin-right: 20px;
        }
        .report_details{
            width:60%;
        }
        .report_scale{
            display: flex;
            width:20%;
        }

        /*----------RF-sensor頁----------*/
        #page2{

        }
        .sensor{
            width: calc(100% - 10px);
            height: fit-content;
            /*padding: 10px;*/
            margin: 5px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
        }
        .sensor_text{
            width: 70%;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 999;
        }

        .modal {
            background-color: white;
            width: 90%;
            max-width: 500px; /* 可自行調整 */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .submit_btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;

            background: linear-gradient(135deg, #4f8cff, #3a6ee8);
            color: #ffffff;

            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;

            border: none;
            cursor: pointer;

            transition: all 0.2s ease;
        }
        .cancel_btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;

            background-color :rgb(114, 114, 114); 
            color: #ffffff;

            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;

            border: none;
            cursor: pointer;

            transition: all 0.2s ease;
        }

        /*----------設定頁----------*/
        .checkbox_label {
            display: inline-flex;
            align-items: center;
            gap: 6px; /* checkbox 與文字間距 */
        }

        label p {
            margin: 0;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #ffffff;
            }
            .server_status{
                background-color: #363636;
                color: #ffffff;
            }
            .nav_main {
                background-color: #363636;
                color: #ffffff;
            }
            .navbar {
                background-color: #363636;
                color :#ffffff
            }
            .sensor{
                background-color: #363636;
                color :#ffffff
            }
            .modal{
                background-color: #363636;
                color :#ffffff
            }
        }
    </style>

        <div id="page2" class="app">
            <div id="RFsensorList" style="width: 100%;">
                <!--我的RF-sensor列表-->

            </div>
            <div id="modalOverlay" class="modal-overlay" style="display:none;">
                <div id="RFsensorPage" class="modal">
                    <h3 id="sensorID"></h3>
                    <hr/>
                    <label for="sensorNameInput">
                        <p>測站名稱</p>
                    </label>
                    <input type="text" id="sensorNameInput">
                    <label for="sensorLatInput">
                        <p>緯度</p>
                    </label>
                    <input type="number" id="sensorLatInput">
                    <label for="sensorLonInput">
                        <p>經度</p>
                    </label>
                    <input type="number" id="sensorLonInput">
                    <hr/>
                    <button id="submit" class="submit_btn">套用</button>
                    <button id="closeModal" class="cancel_btn">返回</button>
                </div>
            </div>

        <div id="settingPage" class="app settingPage">
            <h2>RFEQ帳號</h2>
            <div id="login">
                <label for="email">
                    <p>電子郵件地址:</p>
                </label>
                <input id="email" name="email" type="text">
                <label for="email">
                    <p>密碼:</p>
                </label>
                <input id="password" name="password" type="password">
                <button id="login_btn" class="login_btn">登入</button>
            </div>
            <div id="waiting" style="display: none;">
                <p>等待伺服器連線中，請稍候</p>
            </div>
            <div id="user" style="display: none;">
                <p>歡迎 <span id="login_user"></span></p>
                <button id="logout_btn" class="login_btn">登出</button>
            </div>
            <hr/>
            <div>
                <h2>通知設定</h2>
                <label for="tw_eew" class="checkbox_label">
                    <input id="tw_eew" name="tw_eew" type="checkbox"><p>台灣地震速報(CWA)</p>
                </label>
                
                <label for="RFPLUS" class="checkbox_label">
                    <input id="RFPLUS" name="RFPLUS" type="checkbox"><p>台灣進階參與式地震速報(RFEQ RFPLUS)</p>
                </label>
                
                <label for="jp_eew" class="checkbox_label">
                    <input id="jp_eew" name="jp_eew" type="checkbox"><p>日本地震速報(NIED)</p>
                </label>

                <label for="pga" class="checkbox_label">
                    <input id="pga" name="pga" type="checkbox"><p>測站搖晃檢知(RFEQ)</p>
                </label>

                <label for="report" class="checkbox_label">
                    <input id="report" name="report" type="checkbox"><p>地震報告(CWA)</p>
                </label>
